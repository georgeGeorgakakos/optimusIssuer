name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go — vet, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Vet
        run: go vet ./...

      # The canonicalisation and round-trip tests are the ones that matter: a
      # failure there means credentials this service issues will not verify
      # inside the OptimusDB agents, and the symptom in the field is a bad
      # signature rather than a serialisation fault.
      - name: Test
        run: go test ./... -count=1 -race -coverprofile=coverage.out

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Build binaries
        run: |
          go build -o /tmp/issuerd   ./cmd/issuerd
          go build -o /tmp/issuerctl ./cmd/issuerctl

      # A self-contained end-to-end check with no network and no cluster:
      # generate a key, issue a credential, verify it.
      - name: Round trip with issuerctl
        run: |
          /tmp/issuerctl keygen --out /tmp/ci.key --label ci
          DID=$(/tmp/issuerctl keygen --out /tmp/subject.key --label subject | head -1 | awk '{print $2}')
          /tmp/issuerctl issue \
            --key /tmp/ci.key \
            --subject "$DID" \
            --name "CI subject" \
            --capability crudget:kbmetadata \
            --days 1 \
            --out /tmp/ci.vc.json
          /tmp/issuerctl verify --credential /tmp/ci.vc.json

  web:
    name: Web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        working-directory: web
        run: npm ci

      - name: Build
        working-directory: web
        run: npm run build

      - name: Confirm the bundle landed where the binary embeds it
        run: test -f cmd/issuerd/webdist/index.html

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: [go, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: optimusissuer:ci

  manifests:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every manifest
        run: |
          python3 - <<'EOF'
          import glob, sys, yaml
          bad = 0
          for f in sorted(glob.glob("deploy/*.yaml")):
              try:
                  docs = list(yaml.safe_load_all(open(f)))
                  print(f"  {f}: {len(docs)} document(s)")
              except Exception as e:
                  print(f"  {f}: FAILED — {e}")
                  bad = 1
          sys.exit(bad)
          EOF

  secrets:
    name: No key material committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A private key in the history is not fixable by deleting the file, so
      # this check fails the build rather than warning.
      - name: Scan for key material
        run: |
          if git grep -nE '"privateKeyMultibase"\s*:\s*"z[1-9A-HJ-NP-Za-km-z]{20,}' \
               -- ':!deploy/02-secret.example.yaml' ':!*.md'; then
            echo "::error::A private key appears to be committed."
            exit 1
          fi
          if git ls-files | grep -E '\.key$|\.vc\.json$'; then
            echo "::error::Key or credential files are tracked."
            exit 1
          fi
          echo "clean"
