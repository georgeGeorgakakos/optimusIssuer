apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimusissuer
  namespace: optimusissuer
  labels: { app: optimusissuer }
spec:
  replicas: 1          # a second replica would mean a second copy of the key
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: optimusissuer }
  template:
    metadata:
      labels: { app: optimusissuer }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: issuerd
          image: ghcr.io/georgegeorgakakos/optimusissuer:1.0.0
          imagePullPolicy: IfNotPresent
          args:
            - "-addr=:8090"
            - "-key=/etc/issuer/key/issuer.key"
            - "-agent=http://optimusdb1.optimusddc.svc.cluster.local:8089"
            - "-agent-context=swarmkb"
            - "-oidc-issuer=http://keycloak.optimusddc.svc.cluster.local:8080/realms/optimusddc"
            - "-oidc-audience=optimusissuer"
            - "-max-validity-days=365"
            - "-default-validity-days=90"
            - "-require-second-approval=true"
          ports:
            - { name: http, containerPort: 8090 }
          volumeMounts:
            - name: issuer-key
              mountPath: /etc/issuer/key
              readOnly: true
          readinessProbe:
            httpGet: { path: /api/v1/issuer/health, port: 8090 }
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: 8090 }
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: issuer-key
          secret:
            secretName: issuer-key
            defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  name: optimusissuer
  namespace: optimusissuer
spec:
  selector: { app: optimusissuer }
  ports:
    - { name: http, port: 8090, targetPort: 8090 }
