# Egress is restricted to the two things this service legitimately needs: the
# OptimusDB agents, and Keycloak for operator token verification. A compromised
# container therefore cannot exfiltrate the key to an arbitrary host.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: optimusissuer
  namespace: optimusissuer
spec:
  podSelector:
    matchLabels: { app: optimusissuer }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports:
        - { protocol: TCP, port: 8090 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: optimusddc }
      ports:
        - { protocol: TCP, port: 8089 }   # agents
        - { protocol: TCP, port: 8080 }   # keycloak
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
