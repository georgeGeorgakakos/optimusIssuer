# DO NOT COMMIT A REAL KEY.
#
# Produce this file on the machine holding the key, apply it, then delete the
# local copy:
#
#   kubectl -n optimusissuer create secret generic issuer-key \
#       --from-file=issuer.key=./optimusissuer.key \
#       --dry-run=client -o yaml > secret.yaml
#   kubectl apply -f secret.yaml && shred -u secret.yaml
#
# The key is mounted as a FILE, never as an environment variable, so that it
# does not appear in `kubectl describe pod` or in a crash dump.
apiVersion: v1
kind: Secret
metadata:
  name: issuer-key
  namespace: optimusissuer
type: Opaque
stringData:
  issuer.key: |
    {
      "did": "did:key:REPLACE_ME",
      "keyType": "Ed25519",
      "created": "2026-09-17T09:00:00Z",
      "label": "optimusIssuer service key",
      "privateKeyMultibase": "zREPLACE_ME"
    }
